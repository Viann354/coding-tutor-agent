<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeSensei — AI Coding Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: rgba(255,255,255,0.07);
    --accent: #4ade80;
    --accent2: #60a5fa;
    --accent3: #f472b6;
    --text: #e8eaf0;
    --muted: #6b7280;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-display); height: 100vh; display: flex; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 260px; min-width: 260px; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 16px;
    gap: 8px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  .sidebar-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; padding: 12px 8px 4px; font-family: var(--font-mono); }

  .mode-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; background: transparent;
    color: var(--muted); font-family: var(--font-display); font-size: 13px;
    transition: all 0.15s; text-align: left; width: 100%;
  }
  .mode-btn:hover { background: var(--surface2); color: var(--text); }
  .mode-btn.active { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .mode-btn .mode-icon { font-size: 16px; width: 20px; text-align: center; }
  .mode-dot { width: 6px; height: 6px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }

  .sidebar-bottom { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .lang-toggle {
    display: flex; background: var(--surface2); border-radius: 8px; padding: 3px; gap: 2px;
  }
  .lang-btn {
    flex: 1; padding: 6px; border: none; background: transparent; color: var(--muted);
    font-family: var(--font-mono); font-size: 11px; cursor: pointer; border-radius: 6px; transition: all 0.15s;
  }
  .lang-btn.active { background: var(--border); color: var(--text); }
  .clear-btn {
    width: 100%; margin-top: 8px; padding: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); border-radius: 8px;
    font-family: var(--font-display); font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .clear-btn:hover { color: #f87171; border-color: #f87171; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
  }
  .mode-badge {
    padding: 4px 12px; border-radius: 20px; font-size: 11px;
    font-family: var(--font-mono); border: 1px solid;
  }
  .header-lang { margin-left: auto; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }

  /* Quick actions */
  .quick-actions {
    display: flex; gap: 8px; padding: 12px 24px;
    border-bottom: 1px solid var(--border); overflow-x: auto;
    background: var(--surface);
  }
  .quick-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: var(--font-mono);
    font-size: 11px; cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
  }
  .quick-btn:hover { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.2); }

  /* Chat area */
  .chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

  /* Welcome */
  .welcome {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 16px; color: var(--muted); text-align: center; padding: 40px;
  }
  .welcome-icon { font-size: 48px; }
  .welcome h2 { font-size: 22px; font-weight: 600; color: var(--text); }
  .welcome p { font-size: 14px; line-height: 1.7; max-width: 400px; }
  .welcome-cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .welcome-card {
    padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface2); font-size: 12px; cursor: pointer;
    transition: all 0.15s; color: var(--text);
  }
  .welcome-card:hover { border-color: var(--accent); color: var(--accent); }

  /* Messages */
  .msg { display: flex; gap: 12px; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg.user .msg-avatar { background: linear-gradient(135deg, var(--accent2), var(--accent3)); }
  .msg.assistant .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .msg-bubble {
    max-width: 75%; padding: 12px 16px; border-radius: 14px;
    font-size: 14px; line-height: 1.7; border: 1px solid var(--border);
  }
  .msg.user .msg-bubble { background: var(--surface2); border-radius: 14px 4px 14px 14px; }
  .msg.assistant .msg-bubble { background: var(--surface); border-radius: 4px 14px 14px 14px; }
  .msg-bubble pre { background: #1a1f2e; border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
  .msg-bubble code { font-family: var(--font-mono); font-size: 12px; }
  .msg-bubble p { margin-bottom: 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble h2, .msg-bubble h3 { margin: 12px 0 6px; font-size: 15px; }
  .msg-bubble ul, .msg-bubble ol { padding-left: 20px; }
  .msg-bubble li { margin-bottom: 4px; }
  .msg-mode { font-size: 10px; font-family: var(--font-mono); color: var(--muted); margin-bottom: 6px; }
  .msg-time { font-size: 10px; color: var(--muted); margin-top: 4px; font-family: var(--font-mono); }

  /* Typing */
  .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{ transform: translateY(0); } 30%{ transform: translateY(-6px); } }

  /* Input panel */
  .input-panel {
    padding: 16px 24px 20px; border-top: 1px solid var(--border);
    background: var(--surface);
  }

  /* Debug panel */
  .debug-panel { display: none; gap: 8px; margin-bottom: 12px; }
  .debug-panel.show { display: flex; flex-direction: column; }
  .debug-input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-family: var(--font-mono); font-size: 12px; resize: vertical;
    min-height: 80px; outline: none;
  }
  .debug-input:focus { border-color: rgba(255,255,255,0.2); }

  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-box {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; color: var(--text);
    font-family: var(--font-display); font-size: 14px; resize: none;
    outline: none; max-height: 120px; line-height: 1.5;
    transition: border-color 0.15s;
  }
  .input-box:focus { border-color: rgba(255,255,255,0.2); }
  .input-box::placeholder { color: var(--muted); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 12px; border: none;
    background: var(--accent); color: #0d0f14; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .mode-colors { --chat: #4ade80; --debug: #f87171; --quiz: #60a5fa; --recommend: #f472b6; }
</style>
</head>
<body class="mode-colors">

<div class="sidebar">
  <div class="logo">
    <div class="logo-icon">🧑‍💻</div>
    <div>
      <div class="logo-text">CodeSensei</div>
      <div class="logo-sub">AI Coding Tutor</div>
    </div>
  </div>

  <div class="sidebar-label">Mode</div>

  <button class="mode-btn active" onclick="setMode('chat')" id="btn-chat">
    <span class="mode-icon">💬</span> Chat Bebas
    <span class="mode-dot" style="background: var(--chat)"></span>
  </button>
  <button class="mode-btn" onclick="setMode('debug')" id="btn-debug">
    <span class="mode-icon">🐛</span> Debug Kode
    <span class="mode-dot" style="background: var(--debug)"></span>
  </button>
  <button class="mode-btn" onclick="setMode('quiz')" id="btn-quiz">
    <span class="mode-icon">📝</span> Soal Latihan
    <span class="mode-dot" style="background: var(--quiz)"></span>
  </button>
  <button class="mode-btn" onclick="setMode('recommend')" id="btn-recommend">
    <span class="mode-icon">📚</span> Rekomendasi
    <span class="mode-dot" style="background: var(--recommend)"></span>
  </button>

  <div class="sidebar-bottom">
    <div style="font-size:11px; color:var(--muted); margin-bottom:6px; font-family:var(--font-mono);">Bahasa</div>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('id')" id="lang-id">🇮🇩 Indo</button>
      <button class="lang-btn" onclick="setLang('en')" id="lang-en">🇺🇸 English</button>
    </div>
    <button class="clear-btn" onclick="clearHistory()">🗑 Hapus riwayat</button>
  </div>
</div>

<div class="main">
  <div class="header">
    <span id="header-icon">💬</span>
    <span style="font-weight:600; font-size:15px;" id="header-title">Chat Bebas</span>
    <span class="mode-badge" id="mode-badge" style="color:var(--accent); border-color:var(--accent); background:rgba(74,222,128,0.08);">CHAT</span>
    <span class="header-lang" id="header-lang">🇮🇩 Bahasa Indonesia</span>
  </div>

  <div class="quick-actions" id="quick-actions">
    <button class="quick-btn" onclick="quickSend('Jelaskan apa itu rekursi dalam Python')">📖 Apa itu rekursi?</button>
    <button class="quick-btn" onclick="quickSend('Apa perbedaan list dan tuple di Python?')">🔍 List vs Tuple</button>
    <button class="quick-btn" onclick="quickSend('Buat soal latihan Python untuk pemula')">📝 Soal pemula</button>
    <button class="quick-btn" onclick="quickSend('Rekomendasikan materi belajar JavaScript dari nol')">🚀 Belajar JS dari nol</button>
    <button class="quick-btn" onclick="quickSend('Explain what is Big O notation')">⏱ Big O notation</button>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🧑‍💻</div>
      <h2>Halo! Aku CodeSensei</h2>
      <p>Tutor coding AI-mu. Tanya apapun soal programming, minta debug kode, soal latihan, atau rekomendasi materi belajar.</p>
      <div class="welcome-cards">
        <div class="welcome-card" onclick="quickSend('Apa itu Python dan kenapa populer?')">Python itu apa?</div>
        <div class="welcome-card" onclick="quickSend('Tolong debug kode ini: print(Hello World)')">Debug kode</div>
        <div class="welcome-card" onclick="quickSend('Buat soal latihan tentang loop di Python level menengah')">Soal latihan</div>
        <div class="welcome-card" onclick="quickSend('Rekomendasikan roadmap belajar web development')">Roadmap belajar</div>
      </div>
    </div>
  </div>

  <div class="input-panel">
    <div class="debug-panel" id="debug-panel">
      <textarea class="debug-input" id="code-input" placeholder="Paste kode kamu di sini..."></textarea>
      <textarea class="debug-input" id="error-input" placeholder="Error message (opsional)..." style="min-height:50px;"></textarea>
    </div>
    <div class="input-row">
      <textarea class="input-box" id="msg-input" rows="1" placeholder="Tanya apapun tentang coding..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
let currentMode = 'chat';
let currentLang = 'id';

const modeConfig = {
  chat:      { icon:'💬', title:'Chat Bebas',     badge:'CHAT',      color:'var(--accent)',  borderColor:'var(--accent)',  bg:'rgba(74,222,128,0.08)',  placeholder:'Tanya apapun tentang coding...' },
  debug:     { icon:'🐛', title:'Debug Kode',     badge:'DEBUG',     color:'#f87171',        borderColor:'#f87171',        bg:'rgba(248,113,113,0.08)', placeholder:'Jelaskan masalah kode kamu...' },
  quiz:      { icon:'📝', title:'Soal Latihan',   badge:'QUIZ',      color:' #60a5fa',       borderColor:'#60a5fa',        bg:'rgba(96,165,250,0.08)',  placeholder:'Topik apa? (contoh: loop, array, OOP)' },
  recommend: { icon:'📚', title:'Rekomendasi',    badge:'MATERI',    color:'#f472b6',        borderColor:'#f472b6',        bg:'rgba(244,114,182,0.08)', placeholder:'Mau belajar apa? (contoh: React, SQL, algoritma)' }
};

function setMode(mode) {
  currentMode = mode;
  const cfg = modeConfig[mode];
  document.getElementById('header-icon').textContent = cfg.icon;
  document.getElementById('header-title').textContent = cfg.title;
  const badge = document.getElementById('mode-badge');
  badge.textContent = cfg.badge;
  badge.style.color = cfg.color;
  badge.style.borderColor = cfg.borderColor;
  badge.style.background = cfg.bg;
  document.getElementById('msg-input').placeholder = cfg.placeholder;
  document.getElementById('debug-panel').className = 'debug-panel' + (mode === 'debug' ? ' show' : '');
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode).classList.add('active');
}

function setLang(lang) {
  currentLang = lang;
  document.getElementById('lang-id').className = 'lang-btn' + (lang === 'id' ? ' active' : '');
  document.getElementById('lang-en').className = 'lang-btn' + (lang === 'en' ? ' active' : '');
  document.getElementById('header-lang').textContent = lang === 'id' ? '🇮🇩 Bahasa Indonesia' : '🇺🇸 English';
  const p = document.getElementById('msg-input');
  p.placeholder = lang === 'id' ? modeConfig[currentMode].placeholder : 'Ask anything about coding...';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function addMessage(role, content, mode) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  const modeLabel = mode ? `<div class="msg-mode">● ${mode}</div>` : '';

  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div>
      ${modeLabel}
      <div class="msg-bubble">${role === 'assistant' ? marked.parse(content) : content}</div>
      <div class="msg-time">${time}</div>
    </div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;

  if (role === 'assistant') {
    div.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
  }
}

function addTyping() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing';
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const message = input.value.trim();
  if (!message) return;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  const langPrefix = currentLang === 'en' ? '[Respond in English] ' : '';
  addMessage('user', message);
  addTyping();

  try {
    let endpoint = '/api/chat';
    let body = { message: langPrefix + message };

    if (currentMode === 'debug') {
      const code = document.getElementById('code-input').value;
      const error = document.getElementById('error-input').value;
      if (code) {
        endpoint = '/api/debug';
        body = { code, error, language: 'python', message };
      }
    } else if (currentMode === 'quiz') {
      endpoint = '/api/quiz';
      body = { topic: message, level: 'menengah', language: 'python' };
    } else if (currentMode === 'recommend') {
      endpoint = '/api/recommend';
      body = { topic: message, level: 'pemula', language: 'python' };
    }

    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    removeTyping();
    addMessage('assistant', data.response, data.mode);
  } catch (err) {
    removeTyping();
    addMessage('assistant', '❌ Gagal terhubung ke server. Pastikan Flask sudah berjalan.', 'error');
  }

  btn.disabled = false;
  input.focus();
}

function quickSend(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

async function clearHistory() {
  if (!confirm('Hapus semua riwayat chat?')) return;
  await fetch('/api/history/clear', { method: 'POST' });
  document.getElementById('chat-area').innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🧑‍💻</div>
      <h2>Riwayat dihapus!</h2>
      <p>Mulai sesi baru. Tanya apa saja tentang coding.</p>
    </div>`;
}
</script>
</body>
</html>
